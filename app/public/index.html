<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매장려금 관련자 통제</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --mute:#78716c; --line:#e7e5e4; --warn:#b45309; --bad:#b91c1c; --ok:#15803d; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  main { display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
  table { width:100%; border-collapse:collapse; } td, th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  tr[data-id] { cursor:pointer; } tr[data-id]:hover { background:#f5f5f4; }
  .control_violation { color:var(--bad); } .outcome_error { color:var(--warn); } .pending { color:var(--mute); }
  pre { white-space:pre-wrap; font-size:12px; margin:0; } .mute { color:var(--mute); } button, input { font:inherit; }
</style>
</head>
<body>
<header>
  <strong>W07 판매장려금 · 관련자 그래프</strong>
  <form id="login"><input name="user" placeholder="support / exec" size="10"> <input name="pass" type="password" placeholder="비밀번호" size="8"> <button>로그인</button></form>
  <span id="me" class="mute"></span>
  <button id="reset" title="원본 기준 재적재">초기화</button>
</header>
<main>
  <section><h3>판정 (보류·재판정)</h3><table id="dec"></table></section>
  <section><h3>상세 · 인과 추적</h3><div id="detail" class="mute">판정 또는 Work를 누르세요</div>
    <h3>Work</h3><table id="works"></table>
    <h3>변경 피드 <span class="mute">(3초 폴링)</span></h3><pre id="feed"></pre></section>
</main>
<script>
let token = sessionStorage.getItem('t'); let cursor = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const api = async (path, opt = {}) => {
  const r = await fetch(path, { ...opt, headers: { 'content-type': 'application/json', ...(token && { authorization: `Bearer ${token}` }) } });
  const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error), { body: j }); return j;
};
const won = (n) => n == null ? '' : Number(n).toLocaleString('ko-KR');

async function load() {
  const d = await api('/api/decisions');
  $('#dec').innerHTML = '<tr><th>귀속월</th><th>거래처</th><th>금액</th><th>그룹합산</th><th>상태</th><th>결정권자</th></tr>' + d.map((x) =>
    `<tr data-id="${esc(x.id)}"><td>${esc(x.period)}</td><td>${esc(x.agency_name)}</td><td>${won(x.amount)}</td><td>${won(x.group_total)}</td>
     <td class="${esc(x.knowledge ?? x.acceptance)}">${esc(x.knowledge ?? x.acceptance)}</td><td>${esc(x.decided_level)}</td></tr>`).join('');
  const w = await api('/api/works');
  $('#works').innerHTML = w.slice(0, 30).map((x) =>
    `<tr data-id="${esc(x.id)}"><td>${esc(x.dept)}</td><td>${esc(x.kind)}</td><td>${esc(x.state)}</td><td class="mute">${esc(x.reason)}</td></tr>`).join('');
}

async function show(id) {
  const t = await api(`/api/trace?id=${encodeURIComponent(id)}`);
  let html = `<b>${esc(id)}</b><br>원인: ${t.causes.map(esc).join(' ← ') || '-'}<br>결과: ${t.effects.map(esc).join(' → ') || '-'}`;
  if (id.startsWith('decision:')) {
    const c = await api(`/api/check?id=${encodeURIComponent(id)}`);
    html += `<pre>${esc(JSON.stringify(c, null, 1))}</pre><button data-approve="${esc(id)}">승인</button>`;
  }
  if (id.startsWith('work:')) html += ` <button data-settle="${esc(id)}">완료 처리</button>`;
  $('#detail').innerHTML = html;
}

document.addEventListener('click', async (e) => {
  const row = e.target.closest('tr[data-id]'); if (row) return show(row.dataset.id);
  try {
    if (e.target.dataset.approve) { await api(`/api/approve?id=${encodeURIComponent(e.target.dataset.approve)}`, { method: 'POST' }); alert('승인됨'); }
    if (e.target.dataset.settle) await api(`/api/work/settle?id=${encodeURIComponent(e.target.dataset.settle)}`, { method: 'POST' });
  } catch (err) { alert(`${err.message}\n${JSON.stringify(err.body?.check?.blockers ?? err.body?.check?.required ?? '')}`); }
  load();
});
$('#login').onsubmit = async (e) => {
  e.preventDefault(); const f = new FormData(e.target);
  try { token = (await api('/api/login', { method: 'POST', body: JSON.stringify(Object.fromEntries(f)) })).token; sessionStorage.setItem('t', token); $('#me').textContent = f.get('user'); }
  catch { alert('로그인 실패'); }
};
$('#reset').onclick = async () => { try { await api('/api/reset', { method: 'POST' }); load(); } catch (e) { alert(e.message); } };

async function poll() {
  try {
    const f = await api(`/api/feed${cursor ? `?since=${cursor}` : ''}`); cursor = f.cursor;
    if (f.changes.length) {
      $('#feed').textContent = f.changes.slice(-8).map((c) => `${c.table} ${JSON.stringify(c.changes).slice(0, 120)}`).join('\n') + '\n' + $('#feed').textContent.slice(0, 2000);
      load();
    }
  } catch {}
  setTimeout(poll, 3000);
}
load(); poll();
</script>
</body>
</html>
