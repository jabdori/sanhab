[package]
name = "w07"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
surrealdb = { version = "=4.0.1", default-features = false, features = ["protocol-http", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
aisdk = { version = "=0.6.4", features = ["openai"] }
schemars = "1.2.3"
base64 = "0.22"
async-stream = "0.3.6"
futures = "0.3.34"
